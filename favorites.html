<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="查看你收藏的贵州景区，登录后可随时管理旅行心愿单。">
  <meta name="theme-color" content="#0d5c4d">
  <title>我的收藏 · 黔行</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="favorites">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="黔行 · 贵州景区导览首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <path d="M3 24 11 11l5 8 4-6 9 11H3Z" fill="currentColor" opacity=".96"/>
            <circle cx="24" cy="8" r="3" fill="#f4d58b"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>黔行</strong>
          <small>多彩贵州 · 景区导览</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="主导航">
        <a href="index.html" data-nav="home">景区列表</a>
        <a href="favorites.html" data-nav="favorites">
          我的收藏
          <span class="nav-count" id="favNavCount" hidden>0</span>
        </a>
      </nav>

      <div class="header-auth" id="headerAuth">
        <a class="btn btn-quiet btn-sm" href="login.html">登录</a>
        <a class="btn btn-solid btn-sm" href="login.html?tab=register">注册</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-art" aria-hidden="true">
        <span>收</span>
        <svg viewBox="0 0 1440 300" preserveAspectRatio="none" focusable="false">
          <path d="M0 250 200 150 380 230 580 110 800 245 1000 170 1200 240 1440 140V300H0Z"/>
        </svg>
      </div>
      <div class="container page-hero-inner">
        <p class="hero-eyebrow"><span aria-hidden="true"></span>MY COLLECTION</p>
        <h1>我的收藏</h1>
        <p>把想去的贵州景区放在一起，下一次出发就从这里开始。</p>
        <div class="page-hero-meta">
          <strong id="favCount">0</strong>
          <span>个收藏</span>
          <span class="meta-dot" aria-hidden="true">·</span>
          <span id="favUserLabel">未登录</span>
        </div>
      </div>
    </section>

    <div class="container favorites-main">
      <div class="result-bar favorites-bar">
        <span class="result-text" id="favoritesHint">登录后即可查看你的景区收藏</span>
        <a class="text-link" href="index.html">继续发现景区 →</a>
      </div>

      <div id="favoritesContent" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="footer-mark" aria-hidden="true">黔</span>
        <div>
          <strong>黔行 · 贵州景区导览</strong>
          <p>山路弯弯，风景慢慢。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="index.html">景区列表</a>
        <a href="favorites.html">我的收藏</a>
        <a href="login.html">登录 / 注册</a>
      </div>
      <p class="footer-note">演示项目。景区等级、票价与开放信息请以官方最新公告为准。</p>
    </div>
  </footer>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/favorites.js" defer></script>
</body>
</html>
