<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="登录或注册黔行账号，收藏、评价你喜欢的贵州景区。">
  <meta name="theme-color" content="#0d5c4d">
  <title>登录 / 注册 · 黔行</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-body" data-page="login">
  <div class="auth-shell">
    <aside class="auth-visual">
      <div class="auth-art" aria-hidden="true">
        <span class="auth-watermark">黔</span>
        <svg viewBox="0 0 900 700" preserveAspectRatio="none" focusable="false">
          <circle class="auth-sun" cx="700" cy="150" r="90"/>
          <path class="auth-ridge auth-ridge-1" d="M0 510 130 370 240 470 390 300 520 480 640 390 760 490 900 360V700H0Z"/>
          <path class="auth-ridge auth-ridge-2" d="M0 580 160 460 300 560 450 440 610 570 760 480 900 555V700H0Z"/>
          <path class="auth-ridge auth-ridge-3" d="M0 650 180 570 350 640 540 550 720 640 900 580V700H0Z"/>
        </svg>
      </div>

      <div class="auth-visual-top">
        <a class="brand brand-light" data-go-home aria-label="返回黔行首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <path d="M3 24 11 11l5 8 4-6 9 11H3Z" fill="currentColor" opacity=".96"/>
              <circle cx="24" cy="8" r="3" fill="#f4d58b"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>黔行</strong>
            <small>多彩贵州 · 景区导览</small>
          </span>
        </a>
        <a class="auth-back" data-go-home>返回景区列表 →</a>
      </div>

      <div class="auth-quote">
        <p class="auth-kicker">GUIZHOU · 山地公园省</p>
        <h1>把贵州的山河，<br>收进你的旅行清单。</h1>
        <p class="auth-quote-desc">
          从黄果树的瀑布到梵净山的云海，登录后收藏景区、打分写评价，
          随时回来继续规划下一次出发。
        </p>
        <div class="auth-pills" aria-label="景区特色">
          <span>5A 景区</span>
          <span>民族村寨</span>
          <span>喀斯特秘境</span>
        </div>
      </div>

      <div class="auth-visual-foot">© 2026 黔行 · 贵州景区导览</div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <a class="auth-mobile-back" data-go-home>← 返回景区列表</a>
        <p class="auth-eyebrow">WELCOME TO QIANXING</p>
        <h2 class="auth-title" id="authTitle">欢迎回来</h2>
        <p class="auth-subtitle" id="authSubtitle">登录后即可收藏、评价喜欢的景区</p>

        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
          <button type="button" class="auth-tab is-active" data-mode="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" data-mode="register" role="tab" aria-selected="false">注册</button>
        </div>

        <div class="session-notice" id="sessionNotice" hidden></div>
        <div class="form-error" id="authError" role="alert" hidden></div>

        <form class="auth-form" id="authForm" novalidate>
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="2–20 位中文、字母或数字" maxlength="20" required>
          </div>

          <div class="field">
            <label for="password">
              密码
              <span class="field-hint">至少 6 位</span>
            </label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="32" required>
              <button type="button" class="eye-btn" data-toggle-password="password" aria-label="显示密码" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                  <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M4 4l16 16M9.5 7.2A11.6 11.6 0 0 1 12 7c6 0 9.5 5 9.5 5a18 18 0 0 1-3 3.4M6 8.4A18.3 18.3 0 0 0 2.5 12S6 17 12 17c1 0 1.9-.3 2.7-.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field" id="confirmField" hidden>
            <label for="confirmPassword">确认密码</label>
            <div class="password-wrap">
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" maxlength="32">
              <button type="button" class="eye-btn" data-toggle-password="confirmPassword" aria-label="显示密码" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                  <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                  <path d="M4 4l16 16M9.5 7.2A11.6 11.6 0 0 1 12 7c6 0 9.5 5 9.5 5a18 18 0 0 1-3 3.4M6 8.4A18.3 18.3 0 0 0 2.5 12S6 17 12 17c1 0 1.9-.3 2.7-.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-solid btn-block auth-submit" id="authSubmit">登录</button>
        </form>

        <p class="auth-switch" id="authSwitch">
          <span>还没有账号？</span>
          <button type="button" data-mode-switch="register">立即注册</button>
        </p>

        <p class="auth-note">账号、收藏与评价记录保存在当前浏览器。清除站点数据后，这些记录也会一并清除。</p>
      </div>
    </main>
  </div>

  <script src="assets/js/navigate.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/login.js" defer></script>
</body>
</html>
