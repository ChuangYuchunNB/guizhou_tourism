server:
  port: 8081

spring:
  application:
    name: travel-backend
  datasource:
    # 连接串不指定库名：库由下方 connection-init-sql 自动创建，无需手动建库。
    # 凭据可用环境变量 DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD 覆盖；
    # 默认值匹配本机，开箱即用；对方机器设环境变量即可，无需改源码。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cyc060619}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      # 连接建立时自动建库并切换（库不存在也能启动，无需手动建库）
      connection-init-sql: CREATE DATABASE IF NOT EXISTS tourism_database CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; USE tourism_database
      initialization-fail-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.travel: info
    org.springframework.jdbc: warn

# 后台管理员种子账号：首次启动时若不存在则自动创建。
# 可用环境变量 ADMIN_USERNAME / ADMIN_PASSWORD 覆盖。
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
