<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="黔行 · 贵州各地美食与景点导览：按市/自治州查看本地知名美食推荐与景点精选。">
  <meta name="theme-color" content="#0d5c4d">
  <title>贵州美食与景点 · 黔行</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="city">
  <header class="site-header site-header-transparent" id="cityHeader">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="黔行 · 贵州景区导览首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <path d="M3 24 11 11l5 8 4-6 9 11H3Z" fill="currentColor" opacity=".96"/>
            <circle cx="24" cy="8" r="3" fill="#f4d58b"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>黔行</strong>
          <small>多彩贵州 · 景区导览</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="主导航">
        <a href="index.html" data-nav="home">景区列表</a>
        <a href="favorites.html" data-nav="favorites">
          我的收藏
          <span class="nav-count" id="favNavCount" hidden>0</span>
        </a>
      </nav>

      <div class="header-auth" id="headerAuth">
        <a class="btn btn-quiet btn-sm" href="login.html">登录</a>
        <a class="btn btn-solid btn-sm" href="login.html?tab=register">注册</a>
      </div>
    </div>
  </header>

  <section class="city-hero" id="cityHero" aria-label="市/自治州详情头部">
    <div class="container city-hero-inner">
      <a class="city-back" href="index.html#page2" aria-label="返回贵州全省地图">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>返回全省地图</span>
      </a>

      <p class="city-hero-kicker" id="cityKicker">GUIZHOU · 贵州省</p>
      <h1 id="cityName">加载中…</h1>
      <p class="city-hero-nick" id="cityNick"></p>
      <p class="city-hero-desc" id="cityDesc"></p>
    </div>
    <div class="city-hero-shade" aria-hidden="true"></div>
  </section>

  <main class="city-main">
    <div class="container">
      <nav class="city-tabs" id="cityTabs" role="tablist" aria-label="美食与美景切换">
        <button type="button" class="city-tab is-active" id="tabFood" data-city-tab="food" role="tab" aria-selected="true">
          <span class="city-tab-emoji">🍜</span>
          <span>本地美食</span>
          <span class="city-tab-count" id="tabFoodCount">0</span>
        </button>
        <button type="button" class="city-tab" id="tabSpots" data-city-tab="spots" role="tab" aria-selected="false">
          <span class="city-tab-emoji">🏞️</span>
          <span>景点精选</span>
          <span class="city-tab-count" id="tabSpotsCount">0</span>
        </button>
      </nav>

      <div class="city-content" id="cityContent" role="tabpanel"></div>

      <p class="city-note" id="cityNote">
        以上为内置示例内容，来源：公开旅游资讯整理。
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="footer-mark" aria-hidden="true">黔</span>
        <div>
          <strong>黔行 · 贵州景区导览</strong>
          <p>山路弯弯，风景慢慢。</p>
        </div>
      </div>
      <div class="footer-links">
        <a href="index.html">景区列表</a>
        <a href="favorites.html">我的收藏</a>
        <a href="login.html">登录 / 注册</a>
      </div>
      <p class="footer-note">演示项目。景区等级、票价与开放信息请以官方最新公告为准。</p>
    </div>
  </footer>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/city.js" defer></script>
</body>
</html>
